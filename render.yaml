services:
  - type: web
    name: almudir-almali
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py --serve
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # تُدخَل يدوياً في لوحة Render (سرّية)
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: PYTHON_VERSION
        value: 3.11.9
